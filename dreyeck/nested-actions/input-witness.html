const nativeLog = console.log.bind(console);
const selected = [];
let lastEvent;

  if (value?.event instanceof MessageEvent) lastEvent = value.event;
  if (value && 'count' in value && value.data) selected.push({event:lastEvent, data:value.data, count:value.count});
  nativeLog(value, ...rest);
};

const statuses = [];

const state = {title:"Prior Title", context:priorContext, debug:true, api:{
  element(key) {return document.getElementById(key)},
  status(elem, command, value) {statuses.push({command,value});elem.textContent=command+value},
  trouble(elem, message) {throw Error(message)},
  inspect(elem, key, target) {inspectedTarget=target},
  report(elem, command, html) {reportCalls.push({command,html});elem.innerHTML=html}
}};
function listen_emit({ elem, command, args, state }) {
  if (args.length < 1) return state.api.trouble(elem, `LISTEN expects argument, an action.`)
  const topic = args[0]
  let recent = Date.now()
  let count = 0
  const handler = listen
  handler.action = 'publishSourceData'
  handler.id = elem.id
  window.addEventListener('message', listen)
  $('.main').on('thumb', (evt, thumb) => console.log('jquery', { evt, thumb }))
  // elem.innerHTML = command + ` ⇒ ready`
  state.api.status(elem, command, ` ⇒ ready`)
  // window.listeners = (action=null) => {
  //   return getEventListeners(window).message
  //     .map(t => t.listener)
  //     .filter(f => f.name == 'listen')
  //     .map(f => ({action:f.action,elem:document.getElementById(f.id),count:f.count}))
  // }

  function listen(event) {
    console.log({ event })
    const { data } = event
    if (data.action == 'publishSourceData' && (data.name == topic || data.topic == topic)) {
      count++
      handler.count = count
      if (state.debug) console.log({ count, data })
      if (count <= 100) {
        const now = Date.now()
        const elapsed = now - recent
        recent = now
        // elem.innerHTML = command + ` ⇒ ${count} events, ${elapsed} ms`
        state.api.status(elem, command, ` ⇒ ${count} events, ${elapsed} ms`)
      } else {
        window.removeEventListener('message', listen)
      }
    }
  }
}

function report_emit({ elem, command, args, state }) {
  const key = args[0] || 'temperature'
  if (!(key in state)) return state.api.trouble(elem, `Expect "${key}" in state`)
  const value = state[key]
  const type = typeof value
  if (!['string', 'number'].includes(type))
    return state.api.trouble(elem, `Expect state.${key} to be a string or number`)
  state.api.inspect(elem, key, state)
  state.api.report(elem, command, `<div class=report>${value}</div>`)
}

export async function run(nest, state, initiator) {
  const scope = nest.slice()
  while (scope.length) {
    const code = scope.shift()
    if ('command' in code) {
      const command = code.command
      const elem = state.api ? state.api.element(code.key) : document.getElementById(code.key)
      const [op, ...args] = code.command.split(/ +/)
      const next = scope[0]
      const body = next && 'command' in next ? null : scope.shift()
      const stuff = { command, op, args, body, elem, state, initiator }
      if (state.debug) console.log(stuff)
      if (blocks[op]) await blocks[op].emit.apply(null, [stuff])
      else if (op.match(/^[A-Z]+$/)) state.api.trouble(elem, `${op} doesn't name a block we know.`)
      else if (code.command.match(/\S/)) state.api.trouble(elem, `Expected line to begin with all-caps keyword.`)
    }
  }
}

let reportDispatches = 0;
const blocks = {
  LISTEN:{emit(stuff) {
    capture.invocation = {command:stuff.command,args:stuff.args,body:stuff.body,
      stateType:Object.prototype.toString.call(stuff.state),stateIsPriorObject:stuff.state===state,
      bodyPassedByRun:true,bodyAcceptedByRetainedListen:false};
    return listen_emit(stuff);
  }},
  REPORT:{emit(stuff) {reportDispatches++;return report_emit(stuff)}}
};

    priorState:{titleBefore:priorTitle,titleAfter:state.title,contextMarker:state.context.marker,
      contextIdentityPreserved:priorContextPreserved,stateIsSelectedData:state===selection.data,
      selectedDataHasApi:'api' in selection.data},
    listenerEffect:{statuses:JSON.parse(JSON.stringify(statuses)),automaticReportDispatches:automaticDispatches,

    nestedInput:{status:"unavailable-current-implementation",value:null},
    reportLookupTarget:{status:"unavailable-current-implementation",value:null},
    independentReportProbe:{caller:"explicit fixture call, not nested LISTEN",key:"title",
      inspectedTargetIsPriorState:inspectedTarget===state,
      inspectedTargetIsEventData:inspectedTarget===event.data,
      targetType:Object.prototype.toString.call(inspectedTarget),value:state.title,
      output:reportCalls.at(-1).html}
  };
  const checks=[record.reception.isTrusted,record.reception.sourceIsPopup,record.reception.dataIsDistinctFromSender,
    selection.event===event,selection.data===event.data,state!==selection.data,
    priorTitle==="Prior Title",state.title==="Prior Title",priorContextPreserved,
    automaticDispatches===0,inspectedTarget===state,inspectedTarget!==event.data];
  if(checks.some(c=>!c)) throw Error("actual object-flow assertion failed");
  record.actualObjectChecksPassed=true;
  capture.events.push(record);
  capture.capturedAt=new Date().toISOString();
  document.getElementById("capture").textContent=JSON.stringify(capture,null,2);
});

  window.fixtureEmitted=message;
}
