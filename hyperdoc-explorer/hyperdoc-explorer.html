<h1>HyperDoc Explorer</h1>

<p>
  As explained in <a page="Dependencies" hyperbook="hyperdoc">the main HyperDoc</a>,
  HyperDoc is implemented as two ASDF systems in order to minimize the
  dependencies for code using HyperDoc. This second system, HyperDoc

  browser.
