<h1>HyperDoc</h1>

<p>HyperDoc is a hypertext documentation module for computational systems.</p>

<p>Documentation consists of any combination of:</p>
<ul>
  <li>Text pages</li>
  <li>Source code files</li>
  <li>Data objects</li>
</ul>

<p>All of these items can cross-reference each other.</p>

<p>Learn how to <a page="Creating a HyperDoc">create a HyperDoc</a>.</p>
